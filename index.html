<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Sprint 4</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body>
    <header>
        <h1>DashBoard criado para Sprint 4 - Allan Roberto Molto</h1>
        <button id="btn-aleatorio"><i class="fa-solid fa-dice-six"></i> Gerar crescimento aleatório</button>
    </header>
    <main>
        <section class="mapa-e-informacoes-gerais">
            <div class="info-gerais">
                <h3>Informações do tempo gerais</h3>
                <div  class="valores">
                    <div class="valores-temperatura">
                        <div class="valores-temperatura-label">
                            <p>Temperatura média</p>
                            <p id="temperatura"></p>
                        </div>
                        <i class="fa-solid fa-temperature-high"></i>
                    </div>
                    <div class="valores-precipitacao">
                        <div class="valores-precipitacao-label">
                            <p>Precipitação média</p>
                            <p id="precipitacao"></p>
                        </div>
                        <i class="fa-solid fa-cloud-showers-heavy"></i>
                    </div>
                    <div class="valores-vento">
                        <div class="valores-vento-label">
                            <p>Velocidade do vento média</p>
                            <p id="vento-velocidade"></p>
                        </div>
                        <i class="fa-solid fa-wind"></i>
                    </div>
                    <div class="valores-umidade-ar">
                        <div class="valores-umidade-ar-label">
                            <p>Umidade do ar média</p>
                            <p id="umidade-ar"></p>
                        </div>
                        <i class="fa-solid fa-droplet"></i>
                    </div>
                </div>
            </div>
            <div id="map"></div>
        </section>
        <section id="container-cards">
        </section>
    </main>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="script.js"></script>
</body>
</html>
